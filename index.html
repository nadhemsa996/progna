<!DOCTYPE html>
<html>
<head>
  <title>Mon programme</title>
</head>
<body>

<h1 id="titre"></h1>
<p id="texte"></p>

<script>
fetch('/content/home.json')
  .then(res => res.json())
  .then(data => {
    document.getElementById("titre").innerText = data.titre;
    document.getElementById("texte").innerText = data.texte;
  });
</script>

</body>
</html>
